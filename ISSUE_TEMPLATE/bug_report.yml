name: 🐛 バグ報告
description: サイトの不具合や表示崩れを報告します
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Progulaのご利用ありがとうございます！不具合の報告にご協力をお願いいたします。

  - type: textarea
    id: description
    attributes:
      label: 不具合の概要
      description: どのような問題が発生しているか簡潔に教えてください。
      placeholder: 例：Pythonコースのステージ1で、正解のコードを入力してもクリアにならない。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合が発生するまでの手順を教えてください。
      placeholder: |
        1. 「Pythonコース」を開く
        2. 「ステージ1」を開始する
        3. コードを入力して「実行」を押す
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: ご利用の環境
      options:
        - PC（Chrome / Edge）
        - PC（Safari / Firefox）
        - スマートフォン（iOS / Safari）
        - スマートフォン（Android / Chrome）
        - その他
    validations:
      required: true
